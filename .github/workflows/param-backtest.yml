name: param-backtest
# Runs param_backtest.py (would tuning SMA/Supertrend settings have paid? a
# walk-forward test on ETH since 2016 and BTC since 2015) on GitHub's runner -
# cloud sessions cannot reach Coinbase - and commits param_results.md here.
on:
  push:
    branches: [param-backtest]
    paths-ignore: [param_results.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Tests
        run: python3 -m unittest test_param test_long test_pattern
      - name: Parameter walk-forward backtest
        run: |
          {
            echo "# Parameter walk-forward backtest ($(date -u +%Y-%m-%dT%H:%MZ))"
            python3 param_backtest.py
          } > param_results.md 2>&1 || true
          cat param_results.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add param_results.md
          git commit -m "Parameter backtest results" && git push || true
