name: long-backtest
# Runs long_backtest.py (Supertrend vs the deployed SMA 20/30 on ETH since
# 2016, BTC since 2015) on GitHub's runner - cloud sessions cannot reach
# Coinbase - and commits the report back to this branch as long_results.md.
on:
  push:
    branches: [long-backtest]
    paths-ignore: [long_results.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Tests
        run: python3 -m unittest test_long test_pattern
      - name: Long-history backtest
        run: |
          {
            echo "# Long-history backtest ($(date -u +%Y-%m-%dT%H:%MZ))"
            python3 long_backtest.py
          } > long_results.md 2>&1 || true
          cat long_results.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add long_results.md
          git commit -m "Long-history backtest results" && git push || true
