name: backtests
# Runs the strategy comparison on GitHub's runner (which can reach Kraken)
# and commits the report back to this branch as backtest_results.md.
on:
  push:
    branches: [backtests]
    paths-ignore: [backtest_results.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Compare strategies
        run: |
          {
            echo "# Backtest results ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo; echo "# Daily candles"
            python3 compare_strategies.py --pairs ETH/USD BTC/USD SOL/USD --candle 1440
            echo; echo "# 4h candles (Kraken returns 720 candles = ~120 days only)"
            python3 compare_strategies.py --pairs ETH/USD BTC/USD --candle 240 \
              --fast 20 --slow 30 --momentum 30 60 120 --step 30 --min-run 120
          } > backtest_results.md 2>&1 || true
          cat backtest_results.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results.md
          git commit -m "Backtest results" && git push || true
